<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Salmo e Pimenta — tipografia</title>
<style>
  @font-face { font-family: "Vietnam"; src: url("../../resource/fonts/BeVietnamPro-Bold.ttf"); font-weight: 700; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="gsap.min.js"></script>
<script>
// a peça (pasta) vem em ?peca=salmo46; PALAVRAS é injetado pelo renderizador
const peca = new URLSearchParams(location.search).get("peca");
const carregar = (src) => new Promise((ok, erro) => {
  const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = erro; document.body.appendChild(s);
});
document.fonts.load('700 100px Vietnam')
  .then(() => carregar("motor.js"))
  .then(() => carregar("comum_short.js"))
  .then(() => carregar(`${peca}/coreografia.js`))
  .then(() => window.PRELOAD || null)
  .then(() => { window.DURATION = DURACAO; window.SFX_EVENTOS = SFX; window.READY = true; })
  .catch((e) => console.error("falha ao carregar", e));
</script>
</body>
</html>
