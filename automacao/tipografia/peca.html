<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tipografia cinética</title>
<style>
  @font-face {
    font-family: "Grot";
    src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf");
    font-weight: 900;
  }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="gsap.min.js"></script>
<script>
// ------------------------------------------------------------------
// Configuração
// ------------------------------------------------------------------
const W = 1080, H = 1920;
const BG = "#000", FG = "#fff", ACCENT = "#FF3B1F";   // destaque só em SAIR.
const FONT = (s) => `900 ${s}px Grot`;
const MARGIN = 80, COL = W - MARGIN * 2;              // coluna útil (920px)
// Linha completa: "Não enviamos recursos. Enviamos menos razões para sair."
// Layout final em 5 linhas justificadas pela largura.
const FINAL_LINES = [
  ["nao", "env1"],
  ["rec"],
  ["env2", "menos"],
  ["raz", "para"],
  ["sair"],
];

document.fonts.load(FONT(100)).then(() => {
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const mcv = document.createElement("canvas"); mcv.width = W; mcv.height = H;
const mctx = mcv.getContext("2d");

function measure(text, size) {
  ctx.font = FONT(size);
  const m = ctx.measureText(text);
  return { w: m.width, asc: m.actualBoundingBoxAscent, desc: m.actualBoundingBoxDescent,
           left: m.actualBoundingBoxLeft, right: m.actualBoundingBoxRight };
}
// tamanho de fonte para que `text` ocupe exatamente `width`
function fit(text, width) {
  const m = measure(text, 100);
  return 100 * width / (m.left + m.right);
}

// ------------------------------------------------------------------
// Palavras como objetos físicos
// x = borda esquerda da tinta, y = linha de base, âncora de squash na base
// ------------------------------------------------------------------
const TEXT = { nao: "NÃO", env1: "ENVIAMOS", rec: "RECURSOS.", env2: "ENVIAMOS",
               menos: "MENOS", raz: "RAZÕES", para: "PARA", sair: "SAIR." };
const words = {};
for (const k in TEXT) {
  words[k] = { k, text: TEXT[k], x: 0, y: -2000, s: 100, sx: 1, sy: 1, a: 0,
               color: k === "sair" ? ACCENT : FG, split: 0, gap: 0 };
}
function setSize(wd, s) { wd.s = s; }
function ink(wd) { return measure(wd.text, wd.s); }

const cam = { x: 0, y: 0 };
const mask = { on: 0, scale: 1, ox: 0, oy: 0, fillTop: 0, outline: 0 };

// ------------------------------------------------------------------
// Desenho
// ------------------------------------------------------------------
function drawWord(c, wd) {
  if (wd.a <= 0) return;
  const m = ink(wd);
  const cx = wd.x + (m.right + m.left) / 2;     // centro da tinta
  c.save();
  c.globalAlpha = wd.a;
  c.font = FONT(wd.s);
  c.fillStyle = wd.color;
  c.translate(cx, wd.y);
  c.scale(wd.sx, wd.sy);
  const tx = -(m.right + m.left) / 2 + m.left;
  if (wd.split === 0 && wd.gap === 0) {
    c.fillText(wd.text, tx, 0);
  } else {
    // corte diagonal no meio da palavra; metades deslizam ao longo do corte
    const th = -9 * Math.PI / 180;
    const dx = Math.cos(th), dy = Math.sin(th);      // direção do corte
    const nx = dy, ny = -dx;                         // normal (aponta pra cima)
    const midY = -m.asc / 2;
    const L = 4000;
    for (const side of [1, -1]) {                    // 1 = metade de cima
      c.save();
      const off = side * -1;                         // cima → esquerda, baixo → direita
      c.translate(off * dx * wd.split + side * nx * wd.gap,
                  off * dy * wd.split + side * ny * wd.gap);
      c.beginPath();
      c.moveTo(-L * dx, midY - L * dy);
      c.lineTo(L * dx, midY + L * dy);
      c.lineTo(L * dx + side * nx * L, midY + L * dy + side * ny * L);
      c.lineTo(-L * dx + side * nx * L, midY - L * dy + side * ny * L);
      c.closePath();
      c.clip();
      c.fillText(wd.text, tx, 0);
      c.restore();
    }
  }
  c.restore();
}

function drawMask() {
  // MENOS vira estêncil: dentro das letras aparece RAZÕES
  const me = words.menos, rz = words.raz;
  const m = ink(me);
  const setT = (c) => {
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.translate(cam.x, cam.y);
    c.translate(mask.ox, mask.oy);
    c.scale(mask.scale, mask.scale);
    c.translate(-mask.ox, -mask.oy);
  };
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.globalCompositeOperation = "source-over";
  mctx.clearRect(0, 0, W, H);
  setT(mctx);
  mctx.font = FONT(me.s);
  mctx.fillStyle = "#fff";
  mctx.fillText(me.text, me.x + m.left, me.y);
  mctx.globalCompositeOperation = "source-atop";
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.fillStyle = BG;
  mctx.fillRect(0, 0, W, H);
  mctx.translate(cam.x, cam.y);
  drawWord(mctx, rz);
  // preenchimento branco que "escoa" pra baixo
  setT(mctx);
  mctx.fillStyle = FG;
  mctx.fillRect(-100, mask.fillTop, W + 200, me.y + 40 - mask.fillTop);
  ctx.drawImage(mcv, 0, 0);
  // contorno fino do estêncil
  if (mask.outline > 0) {
    ctx.save();
    setT(ctx);
    ctx.globalAlpha = mask.outline;
    ctx.font = FONT(me.s);
    ctx.strokeStyle = FG;
    ctx.lineWidth = 3 / mask.scale;
    ctx.lineJoin = "miter";
    ctx.strokeText(me.text, me.x + m.left, me.y);
    ctx.restore();
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  ctx.translate(cam.x, cam.y);
  for (const k in words) {
    if (mask.on && (k === "menos" || k === "raz")) continue;
    drawWord(ctx, words[k]);
  }
  if (mask.on) drawMask();
}

// ponto mais "fundo" dentro de uma haste de MENOS (para escalar o estêncil)
function deepestPoint(wd) {
  const m = ink(wd);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.font = FONT(wd.s); g.fillStyle = "#fff";
  g.fillText(wd.text, wd.x + m.left, wd.y);
  const d = g.getImageData(0, 0, W, H).data;
  const on = (x, y) => x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] > 128;
  let best = null, bs = -1;
  for (let y = Math.floor(wd.y - m.asc); y < wd.y; y += 3)
    for (let x = Math.floor(wd.x); x < wd.x + m.left + m.right; x += 3) {
      if (!on(x, y)) continue;
      let l = 0, r = 0, u = 0, dn = 0;
      while (on(x - l, y)) l++;
      while (on(x + r, y)) r++;
      while (on(x, y - u)) u++;
      while (on(x, y + dn)) dn++;
      // precisa cobrir 1080x1920: pesa a dimensão vertical pela proporção
      const sc = Math.min(l / (x + 1), r / (W - x), u / (y + 1), dn / (H - y));
      if (sc > bs) { bs = sc; best = { x, y }; }
    }
  return best;
}

// ------------------------------------------------------------------
// Timeline — Power4.out nas entradas, expo.out nas saídas
// ------------------------------------------------------------------
const IN = "power4.out", OUT = "expo.out";
const tl = gsap.timeline({ paused: true });

function land(t, targets, amt = 0.86) {          // impacto: squash na base
  targets.forEach((wd, i) => {
    const k = amt + (1 - amt) * (i * 0.45);
    tl.set(wd, { sy: k, sx: 1 + (1 - k) * 0.35 }, t);
    tl.to(wd, { sy: 1, sx: 1, duration: 0.32, ease: IN }, t);
  });
}
function shake(t, amp) {
  tl.set(cam, { y: amp }, t);
  tl.to(cam, { y: 0, duration: 0.28, ease: IN }, t);
}
function drop(wd, t, y, from = 1400, dur = 0.42) {
  tl.set(wd, { y: y - from, a: 1 }, t - 0.0001);
  tl.to(wd, { y, duration: dur, ease: IN }, t);
}
const LAND = 0.11;   // momento em que o power4.out "toca" o destino

// ---- Bloco A: NÃO é o chão (0 – 2.6s) ----------------------------
const A = { nao: words.nao, env: words.env1, rec: words.rec };
setSize(A.nao, fit(A.nao.text, COL));
setSize(A.env, fit(A.env.text, COL));
setSize(A.rec, fit(A.rec.text, COL));
const floorY = 1330;
const gapOf = (wd) => wd.s * 0.07;
const naoTop = floorY - ink(A.nao).asc;
const envY = naoTop - gapOf(A.env);
const recY = envY - ink(A.env).asc - gapOf(A.rec);
for (const wd of [A.nao, A.env, A.rec]) wd.x = MARGIN;

drop(A.nao, 0.12, floorY, 1700, 0.5);
shake(0.12 + LAND, 22); land(0.12 + LAND, [A.nao], 0.8);
drop(A.env, 0.72, envY, 1300);
shake(0.72 + LAND, 12); land(0.72 + LAND, [A.env, A.nao], 0.84);
drop(A.rec, 1.18, recY, 1200);
shake(1.18 + LAND, 10); land(1.18 + LAND, [A.rec, A.env, A.nao], 0.86);
// o chão sai, o resto despenca
tl.to(A.nao, { x: -1400, duration: 0.5, ease: OUT }, 2.05);
tl.to(A.env, { y: envY + 2200, duration: 0.55, ease: OUT }, 2.12);
tl.to(A.rec, { y: recY + 2200, duration: 0.55, ease: OUT }, 2.16);
tl.set([A.nao, A.env, A.rec], { a: 0 }, 2.75);

// ---- Bloco B: MENOS é a máscara que revela RAZÕES (2.6 – 4.7s) ----
const B = { env: words.env2, me: words.menos, rz: words.raz };
setSize(B.env, fit(B.env.text, COL));
setSize(B.me, fit(B.me.text, COL));
setSize(B.rz, fit(B.rz.text, COL - 40));
B.env.x = MARGIN; B.me.x = MARGIN; B.rz.x = MARGIN + 20;
const meY = 1180;
const envBY = meY - ink(B.me).asc - gapOf(B.me);
const meCapMid = meY - ink(B.me).asc / 2;
const rzY = meCapMid + measure("RAZOES", B.rz.s).asc / 2;   // centraliza na faixa de MENOS

drop(B.env, 2.62, envBY, 1300);
shake(2.62 + LAND, 10); land(2.62 + LAND, [B.env]);
drop(B.me, 2.92, meY, 1300);
shake(2.92 + LAND, 18); land(2.92 + LAND, [B.me], 0.82);
tl.to(B.env, { y: envBY - 1500, duration: 0.45, ease: OUT }, 3.48);

B.me.y = meY;
const pt = deepestPoint(B.me);
B.me.y = -2000;
tl.set(mask, { on: 1, scale: 1, ox: pt.x, oy: pt.y,
               fillTop: meY - ink(B.me).asc - 30, outline: 1 }, 3.5);
tl.set(B.rz, { a: 1, y: rzY + 260 }, 3.5);
tl.to(mask, { fillTop: meY + 40, duration: 0.42, ease: OUT }, 3.52);  // escoa
tl.to(B.rz, { y: rzY, duration: 0.5, ease: IN }, 3.52);               // RAZÕES sobe por dentro
tl.to(mask, { scale: 90, duration: 0.75, ease: OUT }, 4.05);           // máscara explode
tl.to(mask, { outline: 0, duration: 0.2, ease: OUT }, 4.2);
tl.set(mask, { on: 0 }, 4.82);
tl.set(B.me, { a: 0 }, 4.82);

// ---- Bloco C: RAZÕES PARA SAIR. — SAIR se parte (4.8 – 8.2s) ------
const C = { rz: B.rz, pa: words.para, sa: words.sair };
setSize(C.pa, fit(C.pa.text, COL * 0.62));
// SAIR. definido no layout final; usa o mesmo tamanho aqui
const rzCY = 860;
tl.to(C.rz, { y: rzCY, duration: 0.45, ease: IN }, 4.85);
C.pa.x = MARGIN;
const paY = rzCY + gapOf(C.pa) + ink(C.pa).asc + 6;
drop(C.pa, 5.0, paY, 1300);
shake(5.0 + LAND, 10); land(5.0 + LAND, [C.pa]);

// ---- Layout final ------------------------------------------------
const finalPos = {};
(function layout() {
  const SP = 1.35;   // espaço entre palavras, em múltiplos do espaço da fonte
  const rows = FINAL_LINES.map((row) => {
    const str = row.map((k) => TEXT[k]).join(" ");
    let w100 = (row.length - 1) * measure(" ", 100).w * SP;
    row.forEach((k) => { const m = measure(TEXT[k], 100); w100 += m.left + m.right; });
    const s = 100 * COL / w100;
    const m = measure(str, s);
    return { row, s, asc: m.asc, str };
  });
  // altura total (ascendente com acentos + respiro)
  let total = 0;
  rows.forEach((r, i) => { total += r.asc + (i ? r.s * 0.16 : 0); });
  let y = 860 - total / 2;     // centro levemente acima do meio (UI do TikTok/IG embaixo)
  rows.forEach((r, i) => {
    y += r.asc + (i ? r.s * 0.16 : 0);
    let x = MARGIN;
    const space = measure(" ", r.s).w;
    r.row.forEach((k, j) => {
      const m = measure(TEXT[k], r.s);
      if (j === 0) x -= 0;   // alinha tinta à margem
      finalPos[k] = { x, y, s: r.s };
      x += m.left + m.right + space * SP;
    });
  });
  window.__layout = { total, rows: rows.map((r) => [r.str, Math.round(r.s)]) };
})();

setSize(C.sa, finalPos.sair.s);
C.sa.x = MARGIN;
const saY = paY + gapOf(C.sa) + ink(C.sa).asc + 10;
drop(C.sa, 5.38, saY, 1500, 0.46);
shake(5.38 + LAND, 26); land(5.38 + LAND, [C.sa], 0.78);
// a palavra-chave se divide em duas
tl.to(C.sa, { gap: 10, duration: 0.18, ease: IN }, 6.45);
tl.to(C.sa, { split: 1500, duration: 0.8, ease: OUT }, 6.66);
tl.set(C.sa, { a: 0 }, 7.5);
// pausa curta no vazio, depois RAZÕES PARA despencam
tl.to(C.pa, { y: paY + 2000, duration: 0.5, ease: OUT }, 7.62);
tl.to(C.rz, { y: rzCY + 2200, duration: 0.5, ease: OUT }, 7.68);
tl.set([C.rz, C.pa], { a: 0 }, 8.2);

// ---- Bloco D: a linha completa se monta (8.25 – 9.7s), segura até 12s
const order = ["nao", "env1", "rec", "env2", "menos", "raz", "para"];
const t0 = 8.25, step = 0.12;
order.forEach((k, i) => {
  const wd = words[k], f = finalPos[k], t = t0 + i * step;
  tl.set(wd, { x: f.x, s: f.s, sx: 1, sy: 1, split: 0, gap: 0, color: FG,
               y: f.y - 240, a: 0 }, t - 0.001);
  tl.to(wd, { y: f.y, duration: 0.4, ease: IN }, t);
  tl.to(wd, { a: 1, duration: 0.06, ease: "none" }, t);
  land(t + 0.07, [wd], 0.9);
});
// SAIR. volta: as duas metades deslizam de volta e se fecham
const tS = t0 + order.length * step + 0.04;
tl.set(C.sa, { x: finalPos.sair.x, y: finalPos.sair.y, s: finalPos.sair.s,
               sx: 1, sy: 1, gap: 8, split: 1500, a: 1 }, tS - 0.001);
tl.to(C.sa, { split: 0, duration: 0.55, ease: IN }, tS);
tl.to(C.sa, { gap: 0, duration: 0.2, ease: IN }, tS + 0.3);
shake(tS + 0.32, 14);
tl.set({}, {}, 12);   // duração total

window.DURATION = 12;
window.seek = (t) => { tl.time(t, true); render(); };
window.READY = true;
});
</script>
</body>
</html>
